<!DOCTYPE html>
<html>
<head>
    <title>Админ-панель</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 10px; margin: 0; background: #f9f9f9; }
        h1 { font-size: 20px; text-align: center; margin: 0; }
        h2 { font-size: 18px; margin-top: 20px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f1f1f1; font-weight: bold; cursor: pointer; user-select: none; }
        th:hover { background: #e1e1e1; }
        th.no-sort { cursor: default; }
        th.no-sort:hover { background: #f1f1f1; }
        tr:hover { background: #fafafa; }
        .btn { padding: 6px 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; margin: 2px 0; display: block; width: 100%; text-align: center; text-decoration: none; box-sizing: border-box;}
        .btn-qr { background: #3498db; color: white; }
        .btn-checkout { background: #e74c3c; color: white; }
        .btn-approve { background: #27ae60; color: white; }
        .btn-call { background: #2ecc71; color: white; font-size: 16px; padding: 6px 0; }
        .col-money { text-align: right; white-space: nowrap; }
        
        /* Модальное окно QR */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; text-align: center; max-width: 90%; max-height: 90%; overflow: auto; }
        .modal-content h3 { margin-top: 0; }
        #qrModalCanvas { display: flex; justify-content: center; margin: 20px 0; }
        #qrModalCanvas canvas, #qrModalCanvas img { width: 80vw !important; height: 80vw !important; max-width: 500px; max-height: 500px; }
        .close-modal { background: #555; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; }

        /* Модальное окно расчета */
        .calc-modal { display: none; position: fixed; z-index: 1100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .calc-content { background: white; padding: 25px; border-radius: 15px; text-align: left; max-width: 400px; width: 90%; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .calc-content h3 { margin-top: 0; text-align: center; }
        .calc-content p { font-size: 16px; margin: 8px 0; border-bottom: 1px solid #eee; padding-bottom: 5px; display: flex; justify-content: space-between; }
        .calc-content p span:last-child { font-weight: bold; }
        .calc-content .total-line { font-size: 18px; color: #2c3e50; border-bottom: none; margin-top: 15px; }
        .calc-content .btn-confirm { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="topbar">
        <h1>Панель администратора</h1>
        <button class="btn-logout" id="logoutBtn" style="display:none;" onclick="logout()">Выйти</button>
    </div>
    
    <div id="loginSection">
        <input type="email" id="adminEmail" placeholder="Email админа" style="display:block; width:100%; padding:10px; margin-bottom:10px; box-sizing: border-box;">
        <input type="password" id="adminPass" placeholder="Пароль" style="display:block; width:100%; padding:10px; margin-bottom:10px; box-sizing: border-box;">
        <button class="btn btn-approve" onclick="login()" style="font-size:16px; padding:12px;">Войти</button>
    </div>

    <div id="adminPanel" style="display:none;">
        <h2>Новые заявки</h2>
        <div class="table-container" id="pendingContainer"></div>

        <h2>Дети в комнате</h2>
        <div class="table-container" id="activeContainer"></div>
        
        <div id="debug" style="color: #999; font-size: 12px; margin-top: 20px; text-align: center;"></div>
    </div>

    <!-- Модальное окно для QR -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <h3 id="modalChildName"></h3>
            <div id="qrModalCanvas"></div>
            <button class="close-modal" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно для расчета при закрытии -->
    <div id="calcModal" class="calc-modal">
        <div class="calc-content">
            <h3>Расчет по ребенку</h3>
            <div id="calcDetails"></div>
            <button class="btn-confirm" onclick="confirmCheckout()">Расчет (удалить из списка)</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
