<!DOCTYPE html>
<html>
<head>
    <title>Админ-панель</title>
    <style>
        body { font-family: sans-serif; padding: 20px; } 
        .card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; } 
        .pending { background: #fff3cd; } 
        .active { background: #d4edda; }
        input, button { margin: 5px 0; padding: 8px; }
        .qr-box { text-align: center; min-width: 120px; }
        .qr-box img { width: 100px; height: 100px; border: 1px solid #ddd; }
        .info-block { flex-grow: 1; }
        #debug { color: red; font-size: 12px; margin-top: 20px; }
    </style>
    <!-- Используем другую библиотеку для QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <h1>Панель администратора</h1>
    
    <div id="loginSection">
        <input type="email" id="adminEmail" placeholder="Email админа">
        <input type="password" id="adminPass" placeholder="Пароль">
        <button onclick="login()">Войти</button>
    </div>

    <div id="adminPanel" style="display:none;">
        <h2>Новые заявки (<span id="pendingCount">0</span>)</h2>
        <div id="pendingList"></div>
        <h2>Дети в комнате (<span id="activeCount">0</span>)</h2>
        <div id="activeList"></div>
        <div id="debug"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
