<!DOCTYPE html>
<html>
<head>
    <title>Админ-панель</title>
    <style>
        body { font-family: sans-serif; padding: 20px; } 
        .card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; } 
        .pending { background: #fff3cd; } 
        .active { background: #d4edda; }
        input, button { margin: 5px 0; padding: 8px; display: block; width: 100%; max-width: 300px; }
    </style>
</head>
<body>
    <h1>Панель администратора</h1>
    
    <div id="loginSection">
        <input type="email" id="adminEmail" placeholder="Email админа">
        <input type="password" id="adminPass" placeholder="Пароль">
        <button onclick="login()">Войти</button>
    </div>

    <div id="adminPanel" style="display:none;">
        <h2>Новые заявки</h2>
        <div id="pendingList"></div>
        <h2>Дети в комнате</h2>
        <div id="activeList"></div>
    </div>

    <!-- ЭТА СТРОКА БЫЛА ПРОПУЩЕНА! Она подключает вашу логику -->
    <script type="module" src="app.js"></script>
</body>
</html>
