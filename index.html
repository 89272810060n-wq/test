<!DOCTYPE html>
<html>
<head>
    <title>Детская комната - Регистрация</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>body { font-family: sans-serif; padding: 20px; } input, select, button { display: block; margin: 10px 0; padding: 10px; width: 100%; max-width: 300px; }</style>
</head>
<body>
    <h1>Запись в детскую комнату</h1>
    <form id="visitForm">
        <input type="text" id="childName" placeholder="Имя ребенка" required>
        <input type="text" id="parentPhone" placeholder="Телефон родителя" required>
        <select id="tariff">
            <option value="1">1 час (Базовый)</option>
            <option value="2">2 часа (Базовый)</option>
            <option value="0.5">30 минут</option>
        </select>
        <button type="submit">Отправить заявку администратору</button>
    </form>
    <p id="status"></p>

    <!-- Firebase SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
